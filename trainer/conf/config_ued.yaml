# trainer/conf/config_ued.yaml
# The Ultimate Unified UED Discovery Configuration
# Use 'domain' to toggle between Crafter and MiniGrid experiments automatically.

# 1. Domain-Specific Overrides (Categorized for ease of management)
# ----------------------------------------------------------------------
domain: 'crafter' # 'crafter' OR 'minigrid'

# [Internal Taxonomy] Do not edit these directly unless adding a new domain
domains:
  crafter:
    h: 8
    w: 8
    grid_shape: [2, 31, 31]
    obs_norm: [20, 5, 0]
    action_norm: 17
    attention_mask: 5
    data_folder: ${oc.env:TRAINER_PATH}/data/ued/crafter/
    map_elements: { "grass": "G", "water": "W", "tree": "T", "stone": "R", "coal": "C", "iron": "I", "table": "X", "furnace": "U", "agent": "A", "diamond": "O", "cow": "M", "plant": "t" }
  
  minigrid:
    h: 15
    w: 15
    grid_shape: [3, 0, 0]
    obs_norm: [11, 6, 3]
    action_norm: 7
    attention_mask: 3
    data_folder: ${oc.env:TRAINER_PATH}/data/ued/minigrid/
    map_elements: { "wall": "W", "goal": "G", "door": "O", "key": "K", "lava": "L", "empty": "E", "floor": "F", "agent": "S", "ball": "B", "box": "X", "unseen": "?" }

# 2. Sequential/Training Configuration (Interpolated from Domain pool)
# ----------------------------------------------------------------------
training_generator:
  map_width: ${domains.${domain}.w}
  map_height: ${domains.${domain}.h}
  batch_size: 1
  lr: 8e-4
  map_element: ${domains.${domain}.map_elements}
  env_path: ${oc.env:TRAINER_PATH}/level/level.txt

env:
  collect:
    env_type: ${domain}
    mini_dataset_size: 2000
    data_folder: ${domains.${domain}.data_folder}
    data_save_path: ${domains.${domain}.data_folder}trainer.npz
    maximum_dataset_size: 1000

attention_model:
  env_type: ${domain}
  data_type: discrete
  model_type: Attention
  grid_shape: ${domains.${domain}.grid_shape}
  attention_mask_size: ${domains.${domain}.attention_mask}
  batch_size: 256
  n_cpu: 8
  embed_dim: 256
  num_heads: 1
  n_epochs: 15
  lr: 5e-5
  wd: 1e-5                     # weight decay - required by AttentionWorldModel
  obs_norm_values: ${domains.${domain}.obs_norm}
  action_norm_values: ${domains.${domain}.action_norm}
  valid_values_obj: [1, 2, 4, 5, 8, 10]
  valid_values_color: [0, 1, 5]
  valid_values_state: [0, 1, 2, 3]
  use_wandb: False
  keep_cell_loss: false
  frame_stack: 1
  data_dir: null               # overridden at runtime

  # Model save/load
  freeze_weight: False
  model_save_path: ${oc.env:MODEL_FPATH}/AttentionWM/attention_world_model.ckpt

  # Visualization
  visualization: False
  visualize_every: 1000
  save_path: ${oc.env:TRAINER_PATH}/visulization
  direction_map: {0: 'right', 1: 'down', 2: 'left', 3: 'up'}
  action_map: {0: 'left', 1: 'right', 2: 'forward', 3: 'pickup', 4: 'drop', 5: 'toggle', 6: 'done'}

  # Validation metric
  validation_metric: "mse"

  # Continual Learning / EWC Shielding
  continue_learning: true
  fisher_buffer_size: 500000
  current_sample_ratio: 0.3
  fisher_buffer_elements_ratio: 0.8
  replay_frac: 3
  fisher_beta: 0.3
  lambda_ewc: 20000
  ewc_ratio: 0.9
  lambda_ewc_min: 1e-4
  lambda_ewc_max: 1e3
  lambda_ema: 0.05
  fisher_samples: 1000
  scale_factor: 1.0
  drift_cooldown: 100
  n_phases_to_collect: 1

generator_agent:
  total_iterations: 100
  wm_train_frequency: 1
  map_height: ${domains.${domain}.h}
  map_width: ${domains.${domain}.w}
  agent_type: 'ppo'
  warmup_iterations: 10
  div_k: 10

ablation:
  type: "none"

seed: 0
PPO:
  lr_actor: 3e-4
  lr_critic: 1e-3
