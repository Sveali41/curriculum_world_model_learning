# trainer/conf/config_dr.yaml
# Unified Domain Randomization (DR) Baseline Configuration

defaults:
  - config_mac                 # Inherit WM, EWC, Buffer from unified config
  - _self_

# --- Control Switch ---
domain: 'minigrid'             # Options: 'crafter' or 'minigrid' or 'bipedal'

# --- Force Random Exploration (DR core) ---
generator_agent:
  agent_type: 'random'         # No adversarial, just random maps
  total_iterations: 50 # 30 minigrid 50 bipedal 
  wm_train_frequency: 1
  warmup_iterations: 0         # No need to warm up random

# Logger settings
dr_log_dir: ${paths.results}/dr/
dr_temp_data_dir: ${domains.${domain}.mini_tasks_temp_root}dr/

# Keep DR checkpoints separate from MAC and other baselines.
attention_model:
  model_save_path: ${oc.env:MODEL_FPATH}/AttentionWM/dr_attention_world_model_${domain}_${ablation.type}_seed${seed}.ckpt

domains:
  minigrid:
    rmax_like:
      checkpoint_path: ${oc.env:MODEL_FPATH}/Policy/dr_intrinsic_explorer_minigrid_spatial_ride_v6_seed${seed}.pt

env:
  collect:
    env_visualize_save_path: ${domains.${domain}.env_visualize_folder}dr/${ablation.type}/seed${seed}/

seed: 1
force_fresh_start: true         # Set to true to delete old model and start from scratch
