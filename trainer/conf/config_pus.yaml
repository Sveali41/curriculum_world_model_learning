# WAKER-inspired Parameterized Uncertainty Sampling for MiniGrid.
defaults:
  - config_dr
  - _self_

domain: minigrid

generator_agent:
  total_iterations: 50
  warmup_iterations: 0

domains:
  minigrid:
    exploration_policy: random

env:
  collect:
    data_type: random
    save_env_visualize: false
    save_coverage_visualize: false

pus:
  enabled: true
  num_models: 3
  uniform_fraction: 0.2
  ema_alpha: 0.9
  reservoir_per_theta: 64
  history_train_samples: 1024
  predictor_batch_size: 256

dr_log_dir: ${paths.results}/pus/
dr_temp_data_dir: ${domains.minigrid.mini_tasks_temp_root}pus/

attention_model:
  model_save_path: ${oc.env:MODEL_FPATH}/AttentionWM/pus_attention_world_model_minigrid_${ablation.type}_seed${seed}.ckpt
